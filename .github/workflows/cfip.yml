name: CFIP collect

on:
  schedule:
    # 每 30 分钟（UTC cron，北京时间也是每 30 分钟）
    - cron: "*/30 * * * *"
  workflow_dispatch:

# 同一时间只允许一个实例，避免两次运行抢着提交
concurrency:
  group: cfip-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # 让 date.today() 走北京时间，存档按天切分才对得上
      TZ: Asia/Shanghai
      CFIP_SMTP_PASSWORD: ${{ secrets.CFIP_SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Collect + send due archive + purge
        run: python cfip.py run

      - name: Show status
        if: always()
        run: python cfip.py status

      - name: Persist data & state
        run: |
          git config user.name  "cfip-bot"
          git config user.email "cfip-bot@users.noreply.github.com"
          git add data state.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: cfip $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git pull --rebase --autostash --quiet && git push --quiet; then
              echo "已提交"; exit 0
            fi
            sleep 3
          done
          echo "提交失败，本次数据未持久化"; exit 1